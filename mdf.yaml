# mdf.yaml — MDF Server Configuration
# Reference implementation demo configuration

site:
  url: https://mdf-demo.bitcryptic.com
  name: MDF Demo Site
  contact: admin@mdf-demo.bitcryptic.com

content:
  dir: ./content
  dialect: commonmark
  frontmatter: true
  math: false

pricing:
  default:
    amount: "0.0001"
    currency: USDC
    chain: base
  sections:
    /:
      amount: "0.0000"
    /docs/**:
      amount: "0.0000"
    /micropayment/**:
      amount: "0.00000001"
      currency: "BTC"
      chain: "lightning"
    /premium/**:
      amount: "0.01"
      currency: USDC
      chain: base
    /private/**:
      amount: "0.10"
      currency: USDC
      chain: base
    # Base Sepolia testnet tier — exercises x402 end-to-end with testnet funds.
    /testnet/**:
      amount: "0.0010"
      currency: USDC
      chain: base_sepolia

payment:
  endpoint: /mdf/pay
  accepted_chains: [base, base_sepolia, ethereum, lightning]
  accepted_currencies: [USDC, USDT, BTC]
  # wallet: set via /run/secrets/wallet_address or MDF_WALLET env var

auth:
  endpoint: /mdf/auth
  token_ttl_seconds: 86400
  price_threshold: "0.10"

signals:
  ai_train: false
  ai_input: true
  search: true
  human_only: false

feed:
  url: /feed.xml
  format: atom
  websub_hub: https://pubsubhubbub.appspot.com/
  change_types:
    - content_update
    - new_page
    - pricing_change
    - mdf_capability

dashboard:
  enabled: true
  port: 9090

lightning:
  api_url: http://10.61.21.97:8021/api
  invoice_expiry_seconds: 3600
  # api_token and token_secret are optional and, if present, inert — never read
  # or logged. The server resolves them at startup from /run/secrets/<name>
  # (preferred) or the MDF_ALBY_TOKEN / MDF_LIGHTNING_SECRET env vars, and
  # refuses to start if [lightning] is configured but neither resolves.

# x402 facilitator — any service exposing the standard /verify and /settle
# endpoints. MDF delegates all x402 verification and settlement to it.
facilitator:
  url: https://x402.bitcryptic.com
  scheme: exact
  max_timeout_seconds: 300
  timeout_ms: 15000
  chains:
    base:
      asset: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"   # USDC (Base)
      decimals: 6
      extra: { name: "USD Coin", version: "2" }
      rpc_url: "https://mainnet.base.org"
    base_sepolia:
      asset: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"   # USDC (Base Sepolia)
      decimals: 6
      extra: { name: "USDC", version: "2" }
      rpc_url: "https://sepolia.base.org"
