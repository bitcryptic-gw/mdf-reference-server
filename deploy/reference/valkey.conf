# Valkey config for the MDF 0.3.0 shared store (unraid-private).
#
# Copy to /mnt/cache/appdata/mdf-valkey/valkey.conf on unraid-private.
# Mounted read-only at /etc/valkey/valkey.conf; the container command is
# `valkey-server /etc/valkey/valkey.conf` (see ORG_CMD in my-mdf-valkey.xml).
#
# No host port is published. Reachability is the tailnet ACL's job; this file
# adds authentication on top of that.

# Bind inside the container only. Docker publishes nothing, so this is not a LAN
# listener; the tailnet is the network that can reach it.
bind 0.0.0.0
protected-mode yes
port 6379

dir /data

# AOF is the durability the scheme requires: a replay record must survive a
# restart, and `everysec` bounds the loss window to one second.
appendonly yes
appendfsync everysec
appenddirname appendonlydir

# RDB snapshots are redundant next to AOF and would double the on-disk state.
save ""

# Never evict. An evicted replay record is a settled invoice that can be paid
# again, so the store must fail writes (and the rail degrade) rather than drop
# keys. 256 MB is far above this demo's needs and exists only to bound a runaway.
maxmemory 256mb
maxmemory-policy noeviction

# The password lives in its own file, never in this config: stock Valkey has no
# include-as-value, so an ACL file is the only way to keep it out of a template,
# an env var and `docker inspect`.
#
# The file is mounted at /run/secrets/valkey_acl (mode 600) and must contain a
# default user line with a password, e.g.:
#
#   user default on ><64 hex chars> ~* &* +@all
#
# Generate the password with `openssl rand -hex 32` and put the same value in
# both demo nodes' /run/secrets/valkey_password file. Rotate both together.
aclfile /run/secrets/valkey_acl

logfile ""
